# Install only after this host's own Let's Encrypt certificate has been issued.
# The ACME webroot remains available for renewal without stopping Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name invest-premarket.log-loss.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/invest-premarket/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://invest-premarket.log-loss.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name invest-premarket.log-loss.ru;

    ssl_certificate /etc/letsencrypt/live/invest-premarket.log-loss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest-premarket.log-loss.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:InvestPremarketSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/invest-premarket/current;
    index index.html;
    server_tokens off;
    autoindex off;

    access_log /var/log/nginx/invest-premarket.access.log;
    error_log /var/log/nginx/invest-premarket.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=604800" always;

    location = /signal-in-presentation {
        return 308 /signal-in-presentation/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
