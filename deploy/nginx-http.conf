# Dedicated HTTP virtual host. Used before the site's own TLS certificate exists.
# Do not replace default_server or any existing virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name invest-premarket.log-loss.ru;

    root /var/www/invest-premarket/current;
    index index.html;
    server_tokens off;
    autoindex off;

    access_log /var/log/nginx/invest-premarket.access.log;
    error_log /var/log/nginx/invest-premarket.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/invest-premarket/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /signal-in-presentation {
        return 308 /signal-in-presentation/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
